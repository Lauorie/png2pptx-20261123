# @package _global_
defaults:
  - /configs/anything2fig/arrow_line_full_ft
  - _self_

# Eight-class final semantic-unit fine-tuning: line plus the seven requested
# shape subtypes.  The COCO loader turns category names into SAM3 text prompts.
paths:
  dataset_root: /mnt/shared-storage-user/intern7shared/yinjinhui/datasets/arxiv_paper/data/sam3_semantic_shapes_lines_20260921
  experiment_log_dir: /mnt/shared-storage-user/intern7shared/yinjinhui/datasets/arxiv_paper/data/sam3_training_runs/semantic_shapes_lines_full_ft_20260921
  # The GPU worker executes this checkout from the shared GPFS mount.
  bpe_path: /mnt/shared-storage-user/intern7shared/yinjinhui/Anything2Fig/third_party/sam3/sam3/assets/bpe_simple_vocab_16e6.txt.gz

roboflow_train:
  supercategory: anything2fig_semantic_shapes_lines
  # Full-resolution (1024px) masks can exceed Triton's 32-bit indexing limit
  # at batch size four.  Sampled mask supervision is the standard SAM3 path:
  # it preserves global batch four while bounding both loss memory and indices.
  loss:
    _target_: sam3.train.loss.sam3_loss.Sam3LossWrapper
    matcher: ${scratch.matcher}
    o2m_weight: 2.0
    o2m_matcher:
      _target_: sam3.train.matcher.BinaryOneToManyMatcher
      alpha: 0.3
      threshold: 0.4
      topk: 4
    use_o2m_matcher_on_o2m_aux: false
    loss_fns_find:
      - _target_: sam3.train.loss.loss_fns.Boxes
        weight_dict:
          loss_bbox: 5.0
          loss_giou: 2.0
      - _target_: sam3.train.loss.loss_fns.IABCEMdetr
        weak_loss: false
        weight_dict:
          loss_ce: 20.0
          presence_loss: 20.0
        pos_weight: 10.0
        alpha: 0.25
        gamma: 2
        use_presence: true
        pos_focal: false
        pad_n_queries: 200
        pad_scale_pos: 1.0
      - _target_: sam3.train.loss.loss_fns.Masks
        focal_alpha: 0.25
        focal_gamma: 2.0
        num_sample_points: 12544
        oversample_ratio: 3.0
        importance_sample_ratio: 0.75
        compute_aux: false
        weight_dict:
          loss_mask: 200.0
          loss_dice: 10.0
    loss_fn_semantic_seg:
      _target_: sam3.train.loss.loss_fns.SemanticSegCriterion
      presence_head: true
      presence_loss: false
      focal: true
      focal_alpha: 0.6
      focal_gamma: 2.0
      downsample: false
      weight_dict:
        loss_semantic_seg: 20.0
        loss_semantic_presence: 1.0
        loss_semantic_dice: 30.0
    scale_by_find_batch_size: ${scratch.scale_by_find_batch_size}

trainer:
  max_epochs: 25
  checkpoint:
    save_freq: 5
  meters:
    val:
      roboflow100:
        detection:
          dump_dir: ${launcher.experiment_log_dir}/dumps/anything2fig_semantic_shapes_lines
